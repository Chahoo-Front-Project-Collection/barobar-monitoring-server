services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      STORAGE_PATH: /data/storage
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - replay_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - monitoring_internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barobar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-barobar_monitoring}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitoring_internal

networks:
  monitoring_internal:
    driver: bridge

volumes:
  postgres_data:
  replay_storage:
