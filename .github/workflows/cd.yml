name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      APP_DIR: ${{ vars.APP_DIR }}
      BACKEND_API_BASE_URL: ${{ vars.BACKEND_API_BASE_URL }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Resolve deployment settings
        run: |
          set -euo pipefail

          if [ -z "${EC2_HOST}" ]; then
            echo "EC2_HOST secret is required" >&2
            exit 1
          fi
          if [ -z "${EC2_USER}" ]; then
            echo "EC2_USER secret is required" >&2
            exit 1
          fi
          if [ -z "${EC2_SSH_KEY}" ]; then
            echo "EC2_SSH_KEY secret is required" >&2
            exit 1
          fi
          if [ -z "${APP_DIR}" ]; then
            echo "APP_DIR repository variable is required" >&2
            exit 1
          fi
          if [ -z "${BACKEND_API_BASE_URL}" ]; then
            echo "BACKEND_API_BASE_URL repository variable is required" >&2
            exit 1
          fi
          if [ -z "${DEPLOY_SHA}" ]; then
            echo "DEPLOY_SHA could not be resolved" >&2
            exit 1
          fi

      - name: Configure SSH
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${EC2_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p 22 "${EC2_HOST}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/deploy_key -p 22 "${EC2_USER}@${EC2_HOST}" \
            "APP_DIR='${APP_DIR}' GITHUB_SHA='${DEPLOY_SHA}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$APP_DIR"
          git fetch origin main
          git checkout "$GITHUB_SHA"
          docker compose -f docker-compose.prod.yml build
          docker compose -f docker-compose.prod.yml up -d postgres
          docker compose -f docker-compose.prod.yml run --rm app node node_modules/prisma/build/index.js migrate deploy
          docker compose -f docker-compose.prod.yml up -d --force-recreate app
          docker image prune -f
          REMOTE

      - name: Verify HTTPS health endpoint
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error --retry 10 --retry-delay 3 --retry-connrefused \
            "${BACKEND_API_BASE_URL%/}/health"
